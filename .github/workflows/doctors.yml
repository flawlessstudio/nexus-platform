name: Doctors

on:
  workflow_dispatch:

jobs:
  readiness:
    name: Readiness Doctor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Environment Checks
        run: |
          echo "🔎 Checking environment variables..."
          vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY)
          missing=false
          for v in "${vars[@]}"; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v"
              missing=true
            else
              echo "✅ $v present"
            fi
          done
          if [ "$missing" = true ]; then
            echo "::error::Missing env vars detected. Add them in GitHub Secrets and Vercel."
            exit 1
          fi
          echo "✅ Environment looks good!"