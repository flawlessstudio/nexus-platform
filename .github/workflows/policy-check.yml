# .github/workflows/policy-check.yml
name: Policy Check

on:
  pull_request:
    paths:
      - '**/package.json'
      - 'policy/**'
      - '.github/workflows/policy-check.yml'

jobs:
  opa-conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install conftest
        uses: open-policy-agent/setup-opa@v2
        with:
          opa-version: latest
          conftest-version: latest

      - name: Run Conftest
        run: |
          echo "Running conftest against root package.json..."
          conftest test --policy policy/pnpm.rego package.json
