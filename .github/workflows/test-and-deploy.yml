name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint (apps)
        run: |
          pnpm --filter nexus-web --if-present lint || true
          pnpm --filter nexus-backend --if-present lint || true

      - name: Typecheck (apps)
        run: |
          pnpm --filter nexus-web --if-present typecheck || true
          pnpm --filter nexus-backend --if-present typecheck || true

      - name: Run tests (apps)
        run: |
          pnpm --filter nexus-backend --if-present test || true
          pnpm --filter nexus-web --if-present test || true

      - name: Job summary
        run: |
          echo "# Test and Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Node: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- PNPM: $(pnpm -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Lint + Typecheck + Tests: completed" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
