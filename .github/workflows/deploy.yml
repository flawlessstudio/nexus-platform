# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-check:
    name: '🩺 Readiness Doctor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Readiness Doctor
        run: |
          mkdir -p reports
          node tools/readiness_doctor.mjs --ci | tee reports/readiness_doctor_report.md

      - name: Upload Readiness Report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-doctor-report
          path: reports/readiness_doctor_report.md

  lint-and-test:
    name: '🔬 Lint & Test'
    runs-on: ubuntu-latest
    needs: readiness-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint and Tests
        run: pnpm -r test
