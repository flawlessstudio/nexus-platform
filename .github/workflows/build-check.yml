name: Build Check
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm (optional)
        run: corepack prepare pnpm@latest --activate

      - name: Print tool versions (optional)
        run: |
          node -v
          pnpm -v

      - name: Install deps (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Sanity Doctor
        run: pnpm sanity:strict
