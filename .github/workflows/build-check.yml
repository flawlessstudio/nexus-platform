name: CI — Build check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm -r build

      - name: Verify web build output
        run: |
          if [ ! -d "web/dist" ]; then
            echo "web/dist not found - build may have failed" >&2
            ls -la web || true
            exit 1
          fi

      - name: Lint (optional)
        run: pnpm -r lint || true
